name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Build executable
        shell: cmd
        run: scripts\build_windows.bat --ci
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LingfengFinance-Windows-x64
          path: dist/LingfengFinance.exe
          if-no-files-found: error
          retention-days: 30

  build-macos:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: |
          python3 -m pip install -r requirements.txt
          PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Build application
        run: bash scripts/build_macos.sh
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: LingfengFinance-macOS-${{ matrix.arch }}
          path: dist/LingfengFinance-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 30

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Run tests
        run: |
          python3 -m pip install -r requirements.txt
          PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Build application and check startup
        run: xvfb-run -a bash scripts/build_linux.sh
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: LingfengFinance-Linux-x86_64
          path: dist/LingfengFinance-Linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [build, build-macos, build-linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "凌峰出队助手 $RELEASE_TAG" --generate-notes
