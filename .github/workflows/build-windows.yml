name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Build executable
        shell: cmd
        run: scripts\build_windows.bat --ci
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LingfengFinance-Windows-x64
          path: dist/LingfengFinance.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$env:RELEASE_TAG" "dist/LingfengFinance.exe" --verify-tag --title "凌峰出队助手 $env:RELEASE_TAG" --generate-notes
